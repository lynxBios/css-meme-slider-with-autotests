name: UI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest    
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run server and tests
        run: |
          cd docs
          python -m http.server 8000 &
          SERVER_PID=$!
          sleep 3
          cd ..
          pytest
          kill $SERVER_PID
        